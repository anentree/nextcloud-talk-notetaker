services:
  notetaker:
    build: .
    env_file: .env
    restart: unless-stopped
    # A queued recording is transcribed before the process exits (about 45
    # minutes per hour of call); the 10s default would SIGKILL it and lose it.
    stop_grace_period: 60m
    shm_size: "1g"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # If your Nextcloud host uses split-horizon DNS, Docker resolves it to the
      # public WAN IP and hairpin NAT fails. Pin it to the LAN address instead:
      #   - "cloud.example.com:192.168.1.10"
    # Yield to Nextcloud under CPU contention (Whisper pins every core but one
    # for the length of a transcription); no effect when the box is idle.
    cpu_shares: 512
    deploy:
      resources:
        limits:
          # The wizard writes 6g for Whisper (large-v3-turbo int8 needs ~3 GB)
          # and 2g for Gemini, which also contains a leaking Chromium. An
          # install that never re-ran the wizard keeps 2g.
          memory: ${NOTETAKER_MEMORY_LIMIT:-2g}
    # Without this the json-file driver grows without bound, and every
    # forensic log line is destroyed on the next `compose up --build`.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    # `restart: unless-stopped` only fires when the process exits. A wedged
    # Chromium or a hung poll leaves the container Up with nothing happening;
    # the heartbeat is what makes that state visible.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,time; p=os.getenv('HEARTBEAT_FILE','/tmp/notetaker-heartbeat'); sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 5*int(os.getenv('POLL_INTERVAL_SECONDS','10')) + 120 else 1)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    tmpfs:
      - /tmp/notetaker-audio
    volumes:
      - ./notes:/data/notes
      # Whisper model files (~1.6 GB); survive rebuilds, never in the build context.
      - ./models:/data/models
